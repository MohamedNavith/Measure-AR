<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Measure AR — Web Test & Simulation Harness</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #181920 0%, #08090c 100%);
      overflow: hidden;
    }
    canvas#ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Flashlight Overlay */
    #torch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255,255,230,0.18) 0%, rgba(255,255,200,0.02) 60%, transparent 100%);
      pointer-events: none;
      display: none;
      z-index: 2;
    }

    /* Glassmorphic Base */
    .glass-card {
      background: rgba(22, 22, 26, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      border-radius: 20px;
    }
    .glass-pill {
      background: rgba(22, 22, 26, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-pill:active {
      transform: scale(0.96);
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(30, 30, 36, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: rgba(45, 45, 54, 0.9);
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    .icon-btn.active {
      background: #ffd60a;
      color: #000;
      border-color: #ffd60a;
    }

    /* Top Utility Bar */
    #top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    #unit-pill {
      padding: 8px 14px;
      font-weight: 700;
      font-size: 14px;
      gap: 6px;
      color: #ffd60a;
    }
    #level-pill {
      padding: 6px 14px;
      font-weight: 700;
      font-size: 13px;
      gap: 6px;
    }
    .level-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
      transition: background 0.2s;
    }
    .level-dot.locked {
      background: #32d74b;
      box-shadow: 0 0 8px #32d74b;
    }
    .level-text.locked {
      color: #32d74b;
    }

    #actions-group {
      display: flex;
      gap: 8px;
    }

    /* Status Instruction Banner */
    #status-pill-container {
      position: absolute;
      top: 76px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }
    #status-pill {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      transition: all 0.25s ease;
    }

    /* Center Reticle */
    #reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    .reticle-ring {
      width: 52px;
      height: 52px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .reticle-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      transition: all 0.2s;
    }
    .reticle-ring.locked {
      border-color: #32d74b;
      transform: scale(1.12);
    }
    .reticle-ring.locked .reticle-dot {
      background: #32d74b;
      transform: scale(1.4);
      box-shadow: 0 0 10px #32d74b;
    }

    /* Floating Distance Label */
    #floating-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 6px 14px;
      font-weight: 700;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: #ffd60a;
      z-index: 6;
      pointer-events: none;
      display: none;
    }

    /* Bottom Controls */
    #bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
    }
    #shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffd60a;
      color: #000;
      border: 4px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 6px 24px rgba(255, 214, 10, 0.45);
      font-size: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 2px 10px rgba(255, 214, 10, 0.3);
    }
    .bottom-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(30, 30, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s;
    }
    .bottom-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Result Card (When Done) */
    #result-card {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      padding: 22px;
      z-index: 15;
      display: none;
    }
    .result-header {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }
    .result-value-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
    }
    .result-primary {
      font-size: 36px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #ffd60a;
    }
    .result-secondary {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
    }
    .result-btn-row {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-save {
      background: #ffd60a;
      color: #000;
    }
    .btn-new {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }
    .btn-undo {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Modal Sheets */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: none;
      align-items: flex-end;
    }
    .modal-content {
      width: 100%;
      max-height: 75vh;
      background: #141418;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .history-item {
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-del-btn {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="viewport">
  <div id="torch-overlay"></div>
  <canvas id="ar-canvas"></canvas>

  <!-- Top Utility Bar -->
  <div id="top-bar">
    <div id="unit-pill" class="glass-pill" data-testid="unit-toggle" title="Toggle Unit">
      <span>📏</span>
      <span id="unit-text">M</span>
    </div>

    <div id="level-pill" class="glass-pill" data-testid="level-indicator" title="Digital Level">
      <div id="level-dot" class="level-dot locked"></div>
      <span id="level-text" class="level-text locked">0° LEVEL</span>
    </div>

    <div id="actions-group">
      <button id="torch-btn" class="icon-btn" data-testid="torch-toggle" title="Toggle Flashlight">🔦</button>
      <button id="focus-btn" class="icon-btn" data-testid="focus-toggle" title="Lock Focus">🔒</button>
      <button id="history-btn" class="icon-btn" data-testid="history-btn" title="History">📜</button>
      <button id="settings-btn" class="icon-btn" data-testid="settings-btn" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- Status Instruction Banner -->
  <div id="status-pill-container">
    <div id="status-pill" class="glass-pill" data-testid="instruction-text">Tap + to place start point</div>
  </div>

  <!-- Center Reticle -->
  <div id="reticle-container">
    <div id="reticle-ring" class="reticle-ring locked">
      <div class="reticle-dot"></div>
    </div>
  </div>

  <!-- Floating Distance Badge -->
  <div id="floating-badge" class="glass-pill" data-testid="floating-distance">1.45 m</div>

  <!-- Bottom Active Controls -->
  <div id="bottom-controls">
    <button id="undo-btn" class="bottom-btn" data-testid="undo-btn" title="Undo Point" disabled>↩️</button>
    <button id="shutter-btn" data-testid="shutter-add" title="Place Point">+</button>
    <button id="clear-btn" class="bottom-btn" data-testid="clear-btn" title="Clear All" disabled>🗑️</button>
  </div>

  <!-- Result Card (State == Done) -->
  <div id="result-card" class="glass-card" data-testid="result-card">
    <div class="result-header">MEASUREMENT LOCKED</div>
    <div class="result-value-row">
      <div id="result-primary" class="result-primary" data-testid="result-primary">1.45 m</div>
      <div id="result-secondary" class="result-secondary" data-testid="result-secondary">4' 9"</div>
    </div>
    <div class="result-btn-row">
      <button id="save-btn" class="action-btn btn-save" data-testid="save-btn">💾 Save</button>
      <button id="undo-result-btn" class="action-btn btn-undo" data-testid="undo-result-btn">↩️ Undo</button>
      <button id="new-btn" class="action-btn btn-new" data-testid="new-btn">🔄 New</button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">
        <span>Measurement History</span>
        <button id="close-history" class="close-btn">&times;</button>
      </div>
      <div id="history-list" data-testid="history-list"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">
        <span>Settings</span>
        <button id="close-settings" class="close-btn">&times;</button>
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom: 8px; font-weight:600;">Unit System</label>
        <div style="display:flex; gap: 8px;">
          <button class="glass-pill unit-select-btn" data-unit="M" style="padding: 8px 16px;">Meters (m)</button>
          <button class="glass-pill unit-select-btn" data-unit="CM" style="padding: 8px 16px;">Centimeters (cm)</button>
          <button class="glass-pill unit-select-btn" data-unit="FT" style="padding: 8px 16px;">Feet & In</button>
          <button class="glass-pill unit-select-btn" data-unit="IN" style="padding: 8px 16px;">Inches (in)</button>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0;">
        <span>Haptic Feedback</span>
        <input type="checkbox" id="haptic-toggle" checked style="transform: scale(1.3);">
      </div>
    </div>
  </div>
</div>

<script>
  // Pure Math & Unit Conversion matching DistanceCalculator.kt & UnitConverter.kt
  const UnitConverter = {
    M_TO_CM: 100,
    M_TO_IN: 39.3700787,
    M_TO_FT: 3.2808399,

    formatDistance(meters, unit) {
      const m = Math.max(0, meters);
      switch(unit) {
        case 'CM':
          return (m * this.M_TO_CM).toFixed(1) + ' cm';
        case 'IN':
          return (m * this.M_TO_IN).toFixed(1) + ' in';
        case 'FT': {
          const totalInches = m * this.M_TO_IN;
          let feet = Math.floor(totalInches / 12);
          let inches = Math.round(totalInches - feet * 12);
          if (inches === 12) { feet += 1; inches = 0; }
          return feet > 0 ? `${feet}' ${inches}"` : `${inches}"`;
        }
        case 'M':
        default:
          return m.toFixed(2) + ' m';
      }
    }
  };

  function calculateDistance(p1, p2) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const dz = p2.z - p1.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }

  // App State Machine
  const state = {
    step: 'ReadyToPlaceA', // 'ReadyToPlaceA', 'PlacedA', 'Live', 'Done'
    unit: 'M',
    placedPoints: [],
    reticle: { x: 0, y: 0, z: -1.5, screenX: window.innerWidth / 2, screenY: window.innerHeight / 2 },
    isSurfaceLocked: true,
    isTorchOn: false,
    isFocusLocked: false,
    inclinationDeg: 0,
    history: []
  };

  // Canvas Drawing
  const canvas = document.getElementById('ar-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.reticle.screenX = canvas.width / 2;
    state.reticle.screenY = canvas.height / 2;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function projectToScreen(point) {
    // 3D perspective projection to screen pixels
    const fov = 600;
    const depth = Math.abs(point.z) || 1.5;
    const screenX = canvas.width / 2 + (point.x * fov) / depth;
    const screenY = canvas.height / 2 - (point.y * fov) / depth;
    return { x: screenX, y: screenY };
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Render placed points & connections
    if (state.placedPoints.length > 0) {
      for (let i = 0; i < state.placedPoints.length; i++) {
        const pt = state.placedPoints[i];
        const screenPt = projectToScreen(pt);

        // Draw Anchor Sphere
        ctx.beginPath();
        ctx.arc(screenPt.x, screenPt.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#ffd60a';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Connect anchored segments
        if (i > 0) {
          const prevScreen = projectToScreen(state.placedPoints[i - 1]);
          ctx.beginPath();
          ctx.moveTo(prevScreen.x, prevScreen.y);
          ctx.lineTo(screenPt.x, screenPt.y);
          ctx.strokeStyle = '#ffd60a';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }

      // Draw Live preview line from last point to reticle
      if (state.step === 'Live') {
        const lastScreen = projectToScreen(state.placedPoints[state.placedPoints.length - 1]);
        const reticleScreen = { x: state.reticle.screenX, y: state.reticle.screenY };

        ctx.beginPath();
        ctx.setLineDash([12, 8]);
        ctx.moveTo(lastScreen.x, lastScreen.y);
        ctx.lineTo(reticleScreen.x, reticleScreen.y);
        ctx.strokeStyle = '#32d74b';
        ctx.lineWidth = 3.5;
        ctx.stroke();
        ctx.setLineDash([]);

        // Position Floating Distance Badge at midpoint
        const midX = (lastScreen.x + reticleScreen.x) / 2;
        const midY = (lastScreen.y + reticleScreen.y) / 2;
        const dist = calculateDistance(state.placedPoints[state.placedPoints.length - 1], state.reticle);

        const badge = document.getElementById('floating-badge');
        badge.style.display = 'block';
        badge.style.left = midX + 'px';
        badge.style.top = (midY - 25) + 'px';
        badge.textContent = UnitConverter.formatDistance(dist, state.unit);
      } else {
        document.getElementById('floating-badge').style.display = 'none';
      }
    } else {
      document.getElementById('floating-badge').style.display = 'none';
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // UI Updates & Interactions
  function updateUI() {
    // Instruction Text
    const statusPill = document.getElementById('status-pill');
    switch (state.step) {
      case 'ReadyToPlaceA':
        statusPill.textContent = 'Tap + to place start point';
        break;
      case 'Live':
        statusPill.textContent = 'Move to target and tap + to lock';
        break;
      case 'Done':
        statusPill.textContent = 'Measurement locked';
        break;
    }

    // Reticle
    const reticleRing = document.getElementById('reticle-ring');
    const reticleContainer = document.getElementById('reticle-container');
    if (state.step === 'Done') {
      reticleContainer.style.display = 'none';
    } else {
      reticleContainer.style.display = 'block';
      reticleRing.className = state.isSurfaceLocked ? 'reticle-ring locked' : 'reticle-ring';
    }

    // Bottom Controls & Result Card
    const bottomControls = document.getElementById('bottom-controls');
    const resultCard = document.getElementById('result-card');
    const undoBtn = document.getElementById('undo-btn');
    const clearBtn = document.getElementById('clear-btn');

    undoBtn.disabled = state.placedPoints.length === 0;
    clearBtn.disabled = state.placedPoints.length === 0;

    if (state.step === 'Done') {
      bottomControls.style.display = 'none';
      resultCard.style.display = 'block';

      // Compute total distance
      let totalMeters = 0;
      for (let i = 0; i < state.placedPoints.length - 1; i++) {
        totalMeters += calculateDistance(state.placedPoints[i], state.placedPoints[i + 1]);
      }
      document.getElementById('result-primary').textContent = UnitConverter.formatDistance(totalMeters, state.unit);
      const altUnit = (state.unit === 'M' || state.unit === 'CM') ? 'FT' : 'CM';
      document.getElementById('result-secondary').textContent = UnitConverter.formatDistance(totalMeters, altUnit);
    } else {
      bottomControls.style.display = 'flex';
      resultCard.style.display = 'none';
    }

    // Level Indicator
    const levelDot = document.getElementById('level-dot');
    const levelText = document.getElementById('level-text');
    const isLevel = Math.abs(state.inclinationDeg) <= 1;
    levelDot.className = isLevel ? 'level-dot locked' : 'level-dot';
    levelText.className = isLevel ? 'level-text locked' : 'level-text';
    levelText.textContent = isLevel ? '0° LEVEL' : `${Math.round(state.inclinationDeg)}°`;

    // Unit Pill
    document.getElementById('unit-text').textContent = state.unit;
  }

  // Shutter Tap Event
  document.getElementById('shutter-btn').addEventListener('click', () => {
    if (!state.isSurfaceLocked) return;

    state.placedPoints.push({ ...state.reticle });

    if (state.placedPoints.length === 1) {
      state.step = 'Live';
      // Slightly shift reticle to simulate initial user distance
      state.reticle.x += 0.8;
      state.reticle.y += 0.4;
    } else if (state.placedPoints.length >= 2) {
      state.step = 'Done';
    }
    updateUI();
  });

  // Undo Button
  function handleUndo() {
    if (state.placedPoints.length > 0) {
      state.placedPoints.pop();
      state.step = state.placedPoints.length === 0 ? 'ReadyToPlaceA' : 'Live';
      updateUI();
    }
  }
  document.getElementById('undo-btn').addEventListener('click', handleUndo);
  document.getElementById('undo-result-btn').addEventListener('click', handleUndo);

  // Clear / New Button
  function handleClear() {
    state.placedPoints = [];
    state.step = 'ReadyToPlaceA';
    state.reticle.x = 0;
    state.reticle.y = 0;
    updateUI();
  }
  document.getElementById('clear-btn').addEventListener('click', handleClear);
  document.getElementById('new-btn').addEventListener('click', handleClear);

  // Unit Cycle Pill
  const units = ['M', 'CM', 'FT', 'IN'];
  document.getElementById('unit-pill').addEventListener('click', () => {
    const idx = units.indexOf(state.unit);
    state.unit = units[(idx + 1) % units.length];
    updateUI();
  });

  // Flashlight / Torch Toggle
  const torchBtn = document.getElementById('torch-btn');
  const torchOverlay = document.getElementById('torch-overlay');
  torchBtn.addEventListener('click', () => {
    state.isTorchOn = !state.isTorchOn;
    torchBtn.classList.toggle('active', state.isTorchOn);
    torchOverlay.style.display = state.isTorchOn ? 'block' : 'none';
  });

  // Focus Lock Toggle
  const focusBtn = document.getElementById('focus-btn');
  focusBtn.addEventListener('click', () => {
    state.isFocusLocked = !state.isFocusLocked;
    focusBtn.classList.toggle('active', state.isFocusLocked);
    focusBtn.textContent = state.isFocusLocked ? '🔐' : '🔒';
  });

  // History Modal & Save
  const historyModal = document.getElementById('history-modal');
  document.getElementById('history-btn').addEventListener('click', () => {
    renderHistoryList();
    historyModal.style.display = 'flex';
  });
  document.getElementById('close-history').addEventListener('click', () => {
    historyModal.style.display = 'none';
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    const distText = document.getElementById('result-primary').textContent;
    state.history.unshift({
      id: Date.now(),
      distance: distText,
      timestamp: new Date().toLocaleTimeString(),
      points: state.placedPoints.length
    });
    alert('Measurement saved to History!');
    handleClear();
  });

  function renderHistoryList() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if (state.history.length === 0) {
      list.innerHTML = '<div style="color:rgba(255,255,255,0.5); text-align:center; padding: 20px;">No measurements saved yet.</div>';
      return;
    }
    state.history.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div>
          <div style="font-size:18px; font-weight:700; color:#ffd60a;">${item.distance}</div>
          <div style="font-size:12px; color:rgba(255,255,255,0.6);">${item.timestamp} &bull; ${item.points} Points</div>
        </div>
        <button class="item-del-btn" data-id="${item.id}">Delete</button>
      `;
      div.querySelector('.item-del-btn').addEventListener('click', (e) => {
        state.history = state.history.filter(h => h.id !== item.id);
        renderHistoryList();
      });
      list.appendChild(div);
    });
  }

  // Settings Modal
  const settingsModal = document.getElementById('settings-modal');
  document.getElementById('settings-btn').addEventListener('click', () => {
    settingsModal.style.display = 'flex';
  });
  document.getElementById('close-settings').addEventListener('click', () => {
    settingsModal.style.display = 'none';
  });
  document.querySelectorAll('.unit-select-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.unit = btn.getAttribute('data-unit');
      updateUI();
      settingsModal.style.display = 'none';
    });
  });

  // Programmatic API for Playwright End-to-End Testing
  window.measureArSim = {
    getState: () => ({ ...state }),
    setReticlePosition: (x, y, z) => {
      state.reticle.x = x;
      state.reticle.y = y;
      state.reticle.z = z;
    },
    setSurfaceLocked: (locked) => {
      state.isSurfaceLocked = locked;
      updateUI();
    },
    setTiltAngle: (degrees) => {
      state.inclinationDeg = degrees;
      updateUI();
    },
    triggerShutterTap: () => {
      document.getElementById('shutter-btn').click();
    },
    triggerUnitToggle: () => {
      document.getElementById('unit-pill').click();
    },
    triggerUndo: () => {
      handleUndo();
    },
    triggerClear: () => {
      handleClear();
    }
  };

  updateUI();
</script>

</body>
</html>
